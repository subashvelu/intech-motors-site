<!-- Customer & Vehicle Details -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6 bg-slate-50 p-4 rounded-lg border border-slate-200">
  <div>
    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Customer Phone Number</label>
    <input type="tel" id="custPhone" maxlength="10" pattern="[0-9]{10}" oninput="this.value=this.value.replace(/[^0-9]/g,'')" maxlength="10" pattern="[0-9]{10}" 
           oninput="this.value = this.value.replace(/[^0-9]/g, '')" 
           placeholder="10-digit mobile number" 
           class="w-full border rounded px-3 py-2 text-sm focus:outline-blue-500">
  </div>
  <div>
    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Customer Name</label>
    <input type="text" id="custName" maxlength="30" oninput="this.value=this.value.replace(/[^a-zA-Z\s]/g,'')" maxlength="30" 
           oninput="this.value = this.value.replace(/[^a-zA-Z\s]/g, '')" 
           placeholder="Customer Name (Max 30 chars)" 
           class="w-full border rounded px-3 py-2 text-sm focus:outline-blue-500">
  </div>
  <div>
    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Vehicle Name / Model</label>
    <input type="text" id="vehName" maxlength="30" placeholder="e.g. Renault Kiger" class="w-full border rounded px-3 py-2 text-sm focus:outline-blue-500">
  </div>
  <div>
    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Vehicle Reg Number</label>
    <input type="text" id="vehReg" maxlength="15" placeholder="e.g. TN 06 AC 1606" class="w-full border rounded px-3 py-2 text-sm focus:outline-blue-500 uppercase">
  </div>
  <div>
    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">KMs Driven</label>
    <input type="number" id="vehKm" placeholder="e.g. 21101" class="w-full border rounded px-3 py-2 text-sm focus:outline-blue-500">
  </div>
</div>
