name: Deploy website to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # needed for OIDC login to AWS (no access keys stored!)
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check HTML
        run: npx --yes htmlhint index.html || true

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CF_ID: E2SCBREVWS945N
    steps:
      - uses: actions/checkout@v4

      - name: Login to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::992382545912:role/intech-site-GitHubDeployRole-xZcDvwOP3vIc
          aws-region: ap-south-1

      - name: Upload site to S3
        run: |
          aws s3 sync . s3://intech-site-sitebucket-xhxxjz72ofp8 --delete \
            --exclude ".git/*" --exclude ".github/*" --exclude "infra/*" \
            --exclude "*.md" --exclude ".gitignore"

      - name: Clear CloudFront cache (only if CloudFront is set up)
        if: env.CF_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CF_ID" --paths "/*"
