<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Intech Motors - Admin Invoice Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen p-6 font-sans">

  <!-- PIN Box -->
  <div id="authBox" class="max-w-md mx-auto mt-24 bg-white p-6 rounded-xl shadow-lg border border-slate-200 text-center">
    <h2 class="text-xl font-bold text-slate-800 mb-2">Intech Admin Billing Login</h2>
    <p class="text-xs text-slate-500 mb-4">Enter Secret PIN to access final invoice generator</p>
    <input type="password" id="passCode" placeholder="Enter PIN (Default: 1606)" class="w-full border p-2.5 rounded-lg mb-4 text-center tracking-widest text-lg font-bold">
    <button onclick="checkAuth()" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold p-2.5 rounded-lg transition">Unlock Billing</button>
  </div>

  <!-- Billing Form -->
  <div id="billingArea" class="max-w-4xl mx-auto bg-white p-8 rounded-xl shadow-lg border border-slate-200 hidden">
    <div class="flex justify-between items-center border-b pb-4 mb-6">
      <div>
        <h1 class="text-2xl font-extrabold text-blue-900">INTECH MOTORS - INVOICE GENERATOR</h1>
        <p class="text-xs text-slate-500">Final Official Bill Module</p>
      </div>
      <span class="bg-emerald-100 text-emerald-800 text-xs font-bold px-3 py-1 rounded">ADMIN MODE</span>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-6 bg-slate-50 p-4 rounded-lg">
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">Invoice No</label>
        <input type="text" id="invNo" placeholder="e.g. 3068" class="w-full border p-2 rounded text-sm">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">Customer Phone (10 Digits)</label>
        <input type="tel" id="invPhone" maxlength="10" placeholder="Customer Mobile" class="w-full border p-2 rounded text-sm">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">Customer Name</label>
        <input type="text" id="invCustName" maxlength="30" placeholder="Customer Name" class="w-full border p-2 rounded text-sm">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">Vehicle Name</label>
        <input type="text" id="invCarName" placeholder="Renault Kiger" class="w-full border p-2 rounded text-sm">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">Vehicle Number</label>
        <input type="text" id="invCarNo" placeholder="TN 06 AC 1606" class="w-full border p-2 rounded text-sm uppercase">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">KMs Driven</label>
        <input type="number" id="invKm" placeholder="21101" class="w-full border p-2 rounded text-sm">
      </div>
    </div>

    <!-- Items Table -->
    <div class="mb-4">
      <div class="flex justify-between items-center mb-2">
        <h3 class="font-bold text-slate-700 text-sm">Services / Spares Replaced</h3>
        <button onclick="addInvRow()" class="bg-blue-600 text-white text-xs font-bold px-3 py-1.5 rounded">+ Add Item</button>
      </div>
      <table class="w-full text-left text-sm border" id="invTable">
        <thead class="bg-slate-200 text-xs">
          <tr>
            <th class="p-2">Description</th>
            <th class="p-2 w-20">Qty</th>
            <th class="p-2 w-28 text-right">Rate (Rs)</th>
            <th class="p-2 w-16 text-center">Action</th>
          </tr>
        </thead>
        <tbody id="invBody" class="divide-y"></tbody>
      </table>
    </div>

    <div class="text-right mt-6">
      <button onclick="generateOfficialInvoicePDF()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-6 rounded-lg shadow transition">
        Download Final Invoice (Bill) PDF
      </button>
    </div>
  </div>

  <script>
    function checkAuth() {
      if (document.getElementById('passCode').value === '1606') {
        document.getElementById('authBox').classList.add('hidden');
        document.getElementById('billingArea').classList.remove('hidden');
        addInvRow("Standard Service", 1, 5500);
      } else {
        alert('Invalid PIN!');
      }
    }

    function addInvRow(name = "", qty = 1, rate = 0) {
      const tbody = document.getElementById('invBody');
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="p-2"><input type="text" value="${name}" class="w-full border p-1 rounded text-sm row-name"></td>
        <td class="p-2"><input type="number" value="${qty}" class="w-full border p-1 rounded text-sm text-center row-qty"></td>
        <td class="p-2"><input type="number" value="${rate}" class="w-full border p-1 rounded text-sm text-right row-rate"></td>
        <td class="p-2 text-center"><button onclick="this.closest('tr').remove()" class="text-red-500 font-bold">X</button></td>
      `;
      tbody.appendChild(tr);
    }

    function generateOfficialInvoicePDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'mm', format: 'a4' });
      const invNo = document.getElementById('invNo').value || "3068";
      const invDate = new Date().toISOString().split('T')[0];
      const invPhone = document.getElementById('invPhone').value || "N/A";
      const invCarName = document.getElementById('invCarName').value || "N/A";
      const invCarNo = (document.getElementById('invCarNo').value || "N/A").toUpperCase();
      const invKm = document.getElementById('invKm').value || "N/A";

      // Invoice Header
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(16);
      doc.text("INTECH MOTORS", 14, 18);
      doc.setFontSize(9);
      doc.setFont('helvetica', 'normal');
      doc.text("Multi Brand Car Service\n16/2 West Chitrakulam, Mylapore, Chennai - 4\nTamil Nadu 600004 | Phone: 9500165968", 14, 23);

      doc.setFont('helvetica', 'bold');
      doc.setFontSize(18);
      doc.text("INVOICE", 196, 20, { align: 'right' });
      doc.setFontSize(9);
      doc.setFont('helvetica', 'normal');
      doc.text(`Invoice No: ${invNo}\nDate: ${invDate}\nCustomer No: ${invPhone}`, 196, 26, { align: 'right' });

      doc.line(14, 40, 196, 40);

      // Vehicle Details Box
      doc.autoTable({
        startY: 42,
        theme: 'plain',
        body: [[
          { content: `VEHICLE NAME\n${invCarName}`, styles: { fontStyle: 'bold' } },
          { content: `VEHICLE NUMBER\n${invCarNo}`, styles: { fontStyle: 'bold' } },
          { content: `KMS DRIVEN\n${invKm}`, styles: { fontStyle: 'bold' } }
        ]]
      });

      const tableData = [];
      let sNo = 1, total = 0;
      document.querySelectorAll('#invBody tr').forEach(row => {
        const name = row.querySelector('.row-name').value;
        const qty = parseFloat(row.querySelector('.row-qty').value) || 1;
        const rate = parseFloat(row.querySelector('.row-rate').value) || 0;
        const amt = qty * rate;
        total += amt;
        if(name) tableData.push([sNo++, name, qty, rate.toFixed(2), amt.toFixed(2)]);
      });

      doc.autoTable({
        startY: doc.lastAutoTable.finalY + 3,
        head: [['S.NO', 'DESCRIPTION OF SERVICE / PART', 'QTY', 'RATE (Rs.)', 'AMOUNT (Rs.)']],
        body: tableData,
        theme: 'grid',
        headStyles: { fillColor: [30, 41, 59], textColor: [255, 255, 255] }
      });

      doc.autoTable({
        startY: doc.lastAutoTable.finalY + 4,
        theme: 'plain',
        body: [['TOTAL AMOUNT:', `Rs. ${total.toFixed(2)}`]],
        columnStyles: { 0: { halign: 'right', fontStyle: 'bold' }, 1: { halign: 'right', fontStyle: 'bold', cellWidth: 40 } }
      });

      const finalY = doc.lastAutoTable.finalY + 10;
      doc.setFontSize(8.5);
      doc.setFont('helvetica', 'bold');
      doc.text("Happy Journey! Drive Safe, Stay Safe. Thank You!", 105, finalY, { align: 'center' });
      doc.text("WE CARE FOR YOUR CAR, SO YOU CAN ENJOY THE JOURNEY", 105, finalY + 6, { align: 'center' });

      doc.save(`Intech_Invoice_${invNo}_${invCarNo}.pdf`);
    }
  </script>
</body>
</html>
